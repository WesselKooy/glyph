services:
  postgres:
    image: postgres:16-alpine
    container_name: glyph-postgres
    environment:
      POSTGRES_DB: glyph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - glyph-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d glyph"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  glyph-postgres-data:
